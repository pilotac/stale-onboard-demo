version: v1
name: stale-onboard-demo
stages:
  planning:
    require_milestone: true
    require_issues_assigned: true
  development:
    branch: main
    deploy_target: dev
    required_checks:
      - unit-api
      - contract-build
      - regression-gate
      - build-and-push
      - test-backend
    required_reviewers:
      min_approvals: 1
  testing:
    branch_pattern: main
    required_checks:
      - unit-api
      - contract-build
      - regression-gate
      - build-and-push
      - test-backend
    required_reviewers:
      min_approvals: 1
  evidencing:
    required_reviewers:
      min_approvals: 1
  deployment:
    target: production
    promotion: manual
    requires_evidence_approval: true
    required_checks:
      - Unified CI — Build & Push
traceability:
  mode: off
release_naming:
  format: semver-v-strict
  mapping: R1
