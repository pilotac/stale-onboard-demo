version: v1
name: stale-onboard-demo

stages:
  planning:
    require_milestone: true
    require_issues_assigned: true

  development:
    branch: main
    deploy_target: dev
    required_checks:
      - "Unified CI — Build & Push"

  testing:
    branch_pattern: "release/**"
    deploy_target: staging
    required_checks:
      - "Unified CI — Build & Push"
      - "Deploy App to AWS (DB + Compose)"

  evidencing:
    required_reviewers:
      min_approvals: 1

  deployment:
    target: production
    promotion: manual
    requires_evidence_approval: true
