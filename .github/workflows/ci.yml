# ── LaneSync-managed workflow ─────────────────────────────────────────────
# This file is owned by LaneSync. Future "Update workflows" PRs may replace
# custom edits you make here. Review the PR diff before merging.
name: "LaneSync Evidence CI"

# Generic CI fallback — generated by LaneSync.
# Day-zero safe: produces placeholder reports and uploads evidence to LaneSync.
# Replace the unit test step with your actual build/test commands.

on:
  pull_request:
    branches: [ "main", "release/*" ]
  push:
    branches: [ "main", "release/*" ]
  release:
    types: [published]

jobs:
  build:
    name: "Unified CI — Build & Push"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run unit tests
        run: |
          echo "Running build and unit tests..."
          # Replace with your actual test command, e.g.:
          #   npm ci && npx jest --coverage --json --outputFile=jest-results.json
          #   pip install pytest pytest-cov && pytest --junitxml=pytest-junit.xml
          echo "<html><body><h1>Unit Tests</h1><p>No tests configured yet — replace this step with your build/test command.</p></body></html>" > unit-tests.html
          mkdir -p coverage
          echo "<html><body><h1>Coverage</h1><p>Configure coverage reporting in your test step.</p></body></html>" > coverage/index.html
          echo "<html><body><h1>Integration Tests</h1><p>Configure integration tests here.</p></body></html>" > integration-tests.html

      # ── Integration tests (uncomment and adapt) ──
      # - name: Run integration tests
      #   run: |
      #     # Your integration test command here
      #     echo "<html><body><h1>Integration Tests</h1><p>Results go here.</p></body></html>" > integration-tests.html

      - name: SAST scan (OpenGrep)
        if: always()
        env:
          OPENGREP_VERSION: v1.22.0
          OPENGREP_INSTALL_SHA: f458d7f0d52cc58eae1ca3cf3d5caf101e637519
        run: |
          curl -fsSL "https://raw.githubusercontent.com/opengrep/opengrep/${OPENGREP_INSTALL_SHA}/install.sh" \
            | bash -s -- -v "$OPENGREP_VERSION" || true
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          opengrep scan --config auto --sarif -o sast.sarif . 2>/dev/null || true
          COUNT=$(jq '[.runs[].results[]] | length' sast.sarif 2>/dev/null || echo 0)
          echo "<html><body><h1>SAST (OpenGrep)</h1><p>Findings: ${COUNT}</p></body></html>" > sast-scan-report.html

      - name: CVE scan (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy.txt
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Render CVE report
        if: always()
        run: |
          echo "<html><body><h1>CVE (Trivy)</h1><pre>$(cat trivy.txt 2>/dev/null | head -200 || echo 'no audit output')</pre></body></html>" > cve-scan.html

      - name: Build evidence metrics
        if: always()
        run: |
          SAST_CRIT=0 SAST_HIGH=0
          if [ -f sast.sarif ]; then
            SAST_CRIT=$(jq '[.runs[].results[] | select(.level=="error")] | length' sast.sarif 2>/dev/null || echo 0)
            SAST_HIGH=$(jq '[.runs[].results[] | select(.level=="warning")] | length' sast.sarif 2>/dev/null || echo 0)
          fi
          CVE_CRIT=0 CVE_HIGH=0
          if [ -f trivy.txt ]; then
            CVE_CRIT=$(grep -c CRITICAL trivy.txt 2>/dev/null || true); CVE_CRIT=${CVE_CRIT:-0}
            CVE_HIGH=$(grep -c HIGH trivy.txt 2>/dev/null || true); CVE_HIGH=${CVE_HIGH:-0}
          fi
          jq -n \
            --argjson sast_crit "${SAST_CRIT:-0}" \
            --argjson sast_high "${SAST_HIGH:-0}" \
            --argjson cve_crit "${CVE_CRIT:-0}" \
            --argjson cve_high "${CVE_HIGH:-0}" \
            '{
              unit_tests: { total: 0, passed: 0, failed: 0 },
              integration_tests: { total: 0, passed: 0, failed: 0 },
              coverage: { line_percent: 0 },
              sast_scan: { vulnerabilities: { critical: $sast_crit, high: $sast_high, medium: 0 }, scanned_files: 0 },
              security: { tool: "trivy", vulnerabilities: { critical: $cve_crit, high: $cve_high, medium: 0 } }
            }' > sdlc-evidence.json

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.sha }}
          path: |
            sdlc-evidence.json
            unit-tests.html
            integration-tests.html
            coverage/
            sast-scan-report.html
            cve-scan.html
          retention-days: 30

      - name: Upload evidence to LaneSync
        if: always()
        env:
          SDLC_API_URL: ${{ vars.SDLC_API_URL || 'https://lanesync.dev' }}
        run: |
          REF="${GITHUB_REF#refs/heads/}"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            ENVIRONMENT=production
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [ "$REF" = "main" ]; then
            ENVIRONMENT=dev
            VERSION=dev
          elif case "$REF" in release/*) true;; *) false;; esac; then
            ENVIRONMENT=staging
            VERSION="${REF#release/}"
          else
            echo "Not an evidence branch — skipping upload."
            exit 0
          fi

          if [ -n "${{ secrets.LANESYNC_API_KEY }}" ]; then
            AUTH_HEADER="Authorization: Bearer ${{ secrets.LANESYNC_API_KEY }}"
          else
            TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=lanesync" | jq -r .value)
            AUTH_HEADER="Authorization: Bearer $TOKEN"
          fi
          PAYLOAD=$(jq -n \
            --arg org "${{ github.repository_owner }}" \
            --arg repo "${{ github.event.repository.name }}" \
            --arg version "$VERSION" \
            --arg environment "$ENVIRONMENT" \
            --argjson metrics "$(cat sdlc-evidence.json)" \
            --argjson test_report_files "[]" \
            --rawfile unit_html unit-tests.html \
            --rawfile integration_html integration-tests.html \
            --rawfile coverage_html coverage/index.html \
            --rawfile sast_html sast-scan-report.html \
            --rawfile cve_html cve-scan.html \
            '{ org: $org, repo: $repo, version: $version, environment: $environment, pipeline: "Unified CI — Build & Push", metrics: $metrics, test_report_files: $test_report_files,
               reports: { unit_tests: $unit_html, integration_tests: $integration_html, coverage: $coverage_html, sast_scan: $sast_html, security: $cve_html } }')
          if ! curl --silent --show-error --fail-with-body \
            --connect-timeout 10 --max-time 30 \
            -X POST "$SDLC_API_URL/api/evidence/upload" \
            -H "Content-Type: application/json" -H "$AUTH_HEADER" -d "$PAYLOAD"; then
            echo "Evidence upload failed (non-blocking)."
          fi

  tag:
    name: Auto-Tag on Push
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate and Push Tag
        run: |
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [[ "$BRANCH_NAME" == "main" ]]; then
            NEW_TAG="dev-${SHA_SHORT}"
          # Release candidates are tagged <release>-rc.<N> by LaneSync when it pins them (#155).
          else
            echo "Branch not targeted for auto-tagging."; exit 0
          fi
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $NEW_TAG"
            exit 0
          fi
          git tag "$NEW_TAG"
          if git push origin "$NEW_TAG"; then
            echo "Pushed tag: $NEW_TAG"
          else
            echo "GITHUB_TOKEN could not push ${NEW_TAG}. LaneSync creates it with the app installation token."
          fi
